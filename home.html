<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

::-webkit-scrollbar{width:0px;}

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

/* ══ DATA ══ */
const FIXED=[
{id:1,name:“Moradia”,       amount:4634,due:1, icon:“🏠”,color:”#916DD5”,light:”#DAC7FF”},
{id:2,name:“Carro”,         amount:2712,due:5, icon:“🚗”,color:”#006DA4”,light:”#7EB8E8”},
{id:3,name:“Escola”,        amount:1640,due:20,icon:“📚”,color:”#AC8BEE”,light:”#EBE0FF”},
{id:4,name:“Plano de Saúde”,amount:1900,due:20,icon:“❤️”,color:”#C7ADFF”,light:”#EBE0FF”},
{id:5,name:“Cartões Vitor”, amount:3500,due:20,icon:“💳”,color:”#916DD5”,light:”#DAC7FF”},
{id:6,name:“Cartões Isa”,   amount:2000,due:20,icon:“💳”,color:”#004D74”,light:”#7EB8E8”},

const TOTAL=FIXED.reduce((s,f)=>s+f.amount,0);
const MO=[“Jan”,“Fev”,“Mar”,“Abr”,“Mai”,“Jun”,“Jul”,“Ago”,“Set”,“Out”,“Nov”,“Dez”];
const MO_F=[“Janeiro”,“Fevereiro”,“Março”,“Abril”,“Maio”,“Junho”,“Julho”,“Agosto”,“Setembro”,“Outubro”,“Novembro”,“Dezembro”];
const NOW=new Date(),DAY=NOW.getDate();

const R=v=>new Intl.NumberFormat(“pt-BR”,{style:“currency”,currency:“BRL”}).format(v||0);
const LS={get(){try{return JSON.parse(localStorage.getItem(“cc1”)||”{}”)}catch{return{}}},set(d){try{localStorage.setItem(“cc1”,JSON.stringify(d))}catch{}}};
const until=d=>{if(!d&&d!==0)return null;const n=parseInt(d);if(isNaN(n))return null;if(n===DAY)return 0;if(n>DAY)return n-DAY;return(new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate()-DAY)+n;};

/* ══ PALETTE — exatamente das referências ══ */
const P={
// Fundos
bg:      “#212529”,   // Carbon Black
bg2:     “#2A2F35”,   // entre Carbon e Gunmetal
bg3:     “#343A40”,   // Gunmetal
bg4:     “#3D4349”,   // um tom acima
// Bordas
line:    “rgba(173,181,189,0.10)”,
lineH:   “rgba(173,181,189,0.20)”,
lineA:   “rgba(145,109,213,0.35)”,
// Lavender — acento primário
acc:     “#916DD5”,   // Lavender Purple
accL:    “#DAC7FF”,   // Periwinkle
accLL:   “#EBE0FF”,   // Lavender Veil
accS:    “rgba(145,109,213,0.15)”,
accG:    “rgba(145,109,213,0.30)”,
accM:    “#C7ADFF”,   // Mauve
accSP:   “#AC8BEE”,   // Soft Periwinkle
// Deep Blue — acento secundário
blue:    “#006DA4”,   // Cornflower Ocean
blueD:   “#004D74”,   // Yale Blue
blueDD:  “#03273C”,   // Deep Space Blue
blueS:   “rgba(0,109,164,0.18)”,
// Texto (Pale Slate / Iron Grey)
text:    “#E8ECF0”,
textS:   “#ADB5BD”,   // Pale Slate
textM:   “#6C757D”,   // Slate Grey
textD:   “#495057”,   // Iron Grey
// Positivo/Negativo em roxo/azul
pos:     “#C7ADFF”,   // Mauve — positivo
posS:    “rgba(199,173,255,0.14)”,
neg:     “#AC8BEE”,   // Soft Periwinkle — negativo/alerta
negS:    “rgba(172,139,238,0.14)”,
warn:    “#DAC7FF”,   // Periwinkle — aviso
warnS:   “rgba(218,199,255,0.12)”,
};

/* ══ HOOKS ══ */
function useCount(target,dur=950){
const [v,setV]=useState(0);const ref=useRef({p:0,id:null});
useEffect(()=>{
const s=ref.current.p,diff=target-s,t0=performance.now();
const f=t=>{const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);setV(s+diff*e);if(p<1)ref.current.id=requestAnimationFrame(f);else ref.current.p=target;};
cancelAnimationFrame(ref.current.id);ref.current.id=requestAnimationFrame(f);
return()=>cancelAnimationFrame(ref.current.id);
},[target]);return v;
}

function useAnim(delay=0){
const [on,setOn]=useState(false);
useEffect(()=>{const t=setTimeout(()=>setOn(true),delay);return()=>clearTimeout(t);},[delay]);
return{opacity:on?1:0,transform:on?“translateY(0)”:“translateY(16px)”,transition:`opacity 0.5s cubic-bezier(0.22,1,0.36,1) ${delay}ms, transform 0.5s cubic-bezier(0.22,1,0.36,1) ${delay}ms`};
}

function useHover(){const[h,s]=useState(false);return[h,{onMouseEnter:()=>s(true),onMouseLeave:()=>s(false)}];}

/* ══ LOGO SVG ══ */
function Logo({size=32}){
return(
<svg width={size} height={size} viewBox="0 0 32 32" fill="none">
<defs>
<linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stopColor="#916DD5"/>
<stop offset="100%" stopColor="#006DA4"/>
</linearGradient>
<linearGradient id="lg2" x1="0" y1="1" x2="1" y2="0">
<stop offset="0%" stopColor="#C7ADFF"/>
<stop offset="100%" stopColor="#DAC7FF"/>
</linearGradient>
</defs>
{/* Outer ring */}
<circle cx="16" cy="16" r="15" stroke="url(#lg1)" strokeWidth="1.5" fill="none" opacity="0.6"/>
{/* Inner shape — abstract C */}
<path d="M21 10C18.5 8.5 14 8.5 11.5 11C9 13.5 9 18.5 11.5 21C14 23.5 18.5 23.5 21 22" stroke="url(#lg2)" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
{/* Center dot */}
<circle cx="16" cy="16" r="2.5" fill="url(#lg1)"/>
{/* Accent line */}
<line x1="20" y1="16" x2="25" y2="16" stroke="#916DD5" strokeWidth="2" strokeLinecap="round" opacity="0.8"/>
</svg>
);
}

/* ══ PRIMITIVES ══ */
function Card({children,style,delay=0,glow,onClick,noPad}){
const [h,hp]=useHover();const a=useAnim(delay);
return(
<div onClick={onClick} {…hp} style={{
…a,
background:h?P.bg3:P.bg2,
border:`1px solid ${h&&glow?glow+"40":P.line}`,
borderRadius:16,
padding:noPad?0:“20px 22px”,
boxShadow:h&&glow?`0 8px 40px ${glow}20,0 1px 0 rgba(255,255,255,0.04) inset`:`0 1px 0 rgba(255,255,255,0.03) inset,0 4px 20px rgba(0,0,0,0.25)`,
transition:“all 0.28s cubic-bezier(0.22,1,0.36,1)”,
cursor:onClick?“pointer”:“default”,
overflow:“hidden”,…style
}}>{children}</div>
);
}

function Pill({label,color,bg}){
return<span style={{background:bg||`${color}18`,color,border:`1px solid ${color}28`,borderRadius:20,padding:“3px 10px”,fontSize:10,fontWeight:700,letterSpacing:0.5,whiteSpace:“nowrap”}}>{label}</span>;
}

function DuePill({due}){
const d=until(due);if(d===null)return null;
if(d===0)return<Pill label="HOJE" color={P.accL}/>;
if(d<=3)return<Pill label={`${d}d`} color={P.neg}/>;
if(d<=7)return<Pill label={`${d}d`} color={P.warn}/>;
return<Pill label={`${d}d`} color={P.textD}/>;
}

function Bar({value,max,color,h=6,delay=0}){
const [w,setW]=useState(0);
useEffect(()=>{const t=setTimeout(()=>setW(Math.min(100,(value/(max||1))*100)),delay+120);return()=>clearTimeout(t);},[value,max,delay]);
return(
<div style={{background:“rgba(255,255,255,0.05)”,borderRadius:99,height:h,overflow:“hidden”}}>
<div style={{width:`${w}%`,height:“100%”,background:`linear-gradient(90deg,${color}90,${color})`,borderRadius:99,
boxShadow:`0 0 10px ${color}45`,transition:“width 1.2s cubic-bezier(0.34,1.56,0.64,1)”}}/>
</div>
);
}

function Ring({value,max,color,size=88,stroke=7}){
const [p,setP]=useState(0);
useEffect(()=>{const t=setTimeout(()=>setP(Math.min(100,(value/(max||1))*100)),200);return()=>clearTimeout(t);},[value,max]);
const r=(size-stroke)/2,circ=2*Math.PI*r,dash=(p/100)*circ;
return(
<svg width={size} height={size} style={{transform:“rotate(-90deg)”}}>
<circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={stroke}/>
<circle cx={size/2} cy={size/2} r={r} fill=“none” stroke={color} strokeWidth={stroke}
strokeDasharray={`${dash} ${circ}`} strokeLinecap=“round”
style={{filter:`drop-shadow(0 0 5px ${color}70)`,transition:“stroke-dasharray 1.3s cubic-bezier(0.34,1.56,0.64,1)”}}/>
</svg>
);
}

function Inp({label,value,onChange,prefix,placeholder,type=“text”,style}){
const [f,setF]=useState(false);
return(
<div style={{display:“flex”,flexDirection:“column”,gap:6,…style}}>
{label&&<label style={{fontSize:10,color:P.textM,fontWeight:700,letterSpacing:1}}>{label.toUpperCase()}</label>}
<div style={{display:“flex”,alignItems:“center”,gap:8,
background:f?“rgba(145,109,213,0.06)”:P.bg,
border:`1.5px solid ${f?P.lineA:P.line}`,
borderRadius:11,padding:“10px 14px”,
boxShadow:f?`0 0 0 3px ${P.accS}`:“none”,
transition:“all 0.2s ease”}}>
{prefix&&<span style={{color:P.textD,fontSize:13,fontWeight:500,flexShrink:0}}>{prefix}</span>}
<input type={type} value={value} onChange={e=>onChange(e.target.value)}
placeholder={placeholder} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
style={{background:“none”,border:“none”,outline:“none”,color:P.text,fontSize:14,fontFamily:“inherit”,fontWeight:500,width:“100%”}}/>
</div>
</div>
);
}

function Btn({children,onClick,variant=“primary”,full,disabled,size=“md”}){
const [h,hp]=useHover();const [press,setP]=useState(false);
const v={
primary:{bg:h?”#7A5ABE”:P.acc,color:”#EBE0FF”,shadow:h?`0 4px 24px ${P.accG}`:P.accS},
ghost:{bg:h?P.bg3:“transparent”,color:P.textS,border:P.line},
blue:{bg:h?”#005A88”:P.blue,color:”#E0EEFF”,shadow:h?`0 4px 20px ${P.blueS}`:“none”},
outline:{bg:“transparent”,color:P.accL,border:P.acc+“50”},
}[variant]||{};
return(
<button onClick={onClick} disabled={disabled} {…hp}
onMouseDown={()=>setP(true)} onMouseUp={()=>setP(false)} onMouseLeave={()=>{setP(false);}}
style={{
background:v.bg,color:v.color,
border:v.border?`1px solid ${v.border}`:“none”,
borderRadius:size===“sm”?8:11,
padding:size===“sm”?“6px 13px”:“11px 22px”,
fontSize:size===“sm”?11:13,fontWeight:700,fontFamily:“inherit”,
cursor:disabled?“not-allowed”:“pointer”,opacity:disabled?0.3:1,
width:full?“100%”:“auto”,letterSpacing:0.2,
boxShadow:v.shadow||“none”,
transform:press?“scale(0.97)”:h&&!disabled?“translateY(-1px)”:“none”,
transition:“all 0.2s cubic-bezier(0.22,1,0.36,1)”}}>{children}</button>
);
}

/* ══ NAV ══ */
const TABS=[
{id:“dashboard”,label:“Visão Geral”,ico:“M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z”},
{id:“income”,   label:“Entradas”,  ico:“M12 19V5M5 12l7-7 7 7”},
{id:“simulator”,label:“Simulador”, ico:“M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 8v4M12 16h.01”},
];

function NavIcon({path,size=15,active}){
return(
<svg width={size} height={size} viewBox=“0 0 24 24” fill=“none” stroke=“currentColor” strokeWidth={active?“2.5”:“2”} strokeLinecap=“round” strokeLinejoin=“round”>
<path d={path}/>
</svg>
);
}

function Sidebar({active,setActive}){
return(
<div style={{width:220,minHeight:“100vh”,flexShrink:0,display:“flex”,flexDirection:“column”,
background:P.bg2,borderRight:`1px solid ${P.line}`,padding:“24px 12px 20px”}}>
{/* Logo */}
<div style={{padding:“0 10px 32px”,animation:“fadeIn 0.5s ease both”}}>
<div style={{display:“flex”,alignItems:“center”,gap:11}}>
<Logo size={34}/>
<div>
<div style={{fontSize:13,fontWeight:800,color:P.text,letterSpacing:-0.3}}>Chammas</div>
<div style={{fontSize:9,background:`linear-gradient(90deg,${P.acc},${P.blue})`,WebkitBackgroundClip:“text”,WebkitTextFillColor:“transparent”,letterSpacing:1.6,fontWeight:700,marginTop:1}}>CONTROLLER</div>
</div>
</div>
</div>
{/* Nav */}
<div style={{display:“flex”,flexDirection:“column”,gap:3,flex:1}}>
{TABS.map((tab,i)=>{
const on=active===tab.id;
return(
<button key={tab.id} onClick={()=>setActive(tab.id)}
style={{display:“flex”,alignItems:“center”,gap:10,padding:“10px 12px”,borderRadius:11,
border:`1px solid ${on?P.lineA:"transparent"}`,fontFamily:“inherit”,
background:on?P.accS:“transparent”,
color:on?P.accL:P.textM,fontSize:13,fontWeight:on?700:400,
boxShadow:on?`0 2px 16px ${P.accS}`:“none”,
cursor:“pointer”,transition:“all 0.22s cubic-bezier(0.22,1,0.36,1)”,
animation:`slideIn 0.4s ease ${i*60+60}ms both`,textAlign:“left”,width:“100%”}}>
<span style={{opacity:on?1:0.6,color:on?P.accL:P.textM}}>
<NavIcon path={tab.ico} active={on}/>
</span>
{tab.label}
{on&&<div style={{marginLeft:“auto”,width:5,height:5,borderRadius:“50%”,background:P.acc,boxShadow:`0 0 8px ${P.acc}`,animation:“pulse 2s ease infinite”}}/>}
</button>
);
})}
</div>
{/* Date */}
<div style={{padding:“14px 10px 0”,borderTop:`1px solid ${P.line}`}}>
<div style={{fontSize:10,color:P.textD,fontWeight:500,lineHeight:1.6}}>
{NOW.toLocaleDateString(“pt-BR”,{weekday:“long”}).toUpperCase()}<br/>
<span style={{color:P.textM}}>{NOW.toLocaleDateString(“pt-BR”,{day:“numeric”,month:“long”,year:“numeric”})}</span>
</div>
</div>
</div>
);
}

function BottomNav({active,setActive}){
return(
<div style={{position:“fixed”,bottom:0,left:0,right:0,zIndex:50,
background:“rgba(33,37,41,0.95)”,borderTop:`1px solid ${P.line}`,
backdropFilter:“blur(30px)”,paddingBottom:“env(safe-area-inset-bottom,4px)”,display:“flex”}}>
{TABS.map(tab=>{
const on=active===tab.id;
return(
<button key={tab.id} onClick={()=>setActive(tab.id)}
style={{flex:1,display:“flex”,flexDirection:“column”,alignItems:“center”,gap:4,padding:“11px 4px 8px”,
border:“none”,background:“none”,cursor:“pointer”,color:on?P.accL:P.textD,
fontFamily:“inherit”,transition:“all 0.22s”}}>
<span style={{transform:on?“scale(1.12)”:“scale(1)”,transition:“transform 0.3s cubic-bezier(0.34,1.56,0.64,1)”}}>
<NavIcon path={tab.ico} active={on}/>
</span>
<span style={{fontSize:9,fontWeight:on?700:400,letterSpacing:0.3}}>{tab.label}</span>
{on&&<div style={{width:16,height:2,borderRadius:99,background:P.acc,boxShadow:`0 0 6px ${P.acc}`}}/>}
</button>
);
})}
</div>
);
}

/* ══ HEADER shared ══ */
function PageHeader({sub,title,right,delay=0}){
const a=useAnim(delay);
return(
<div style={{…a,display:“flex”,justifyContent:“space-between”,alignItems:“flex-end”,marginBottom:32,flexWrap:“wrap”,gap:12}}>
<div>
<div style={{fontSize:10,color:P.textD,fontWeight:700,letterSpacing:1.8,marginBottom:7}}>{sub.toUpperCase()}</div>
<h1 style={{fontSize:window.innerWidth<768?26:34,fontWeight:800,color:P.text,letterSpacing:-1}}>{title}</h1>
</div>
{right}
</div>
);
}

/* ══ DASHBOARD ══ */
function Dashboard({incomes,month,year}){
const isMobile=window.innerWidth<768;
const total=incomes.filter(i=>i.month===month&&i.year===year).reduce((s,i)=>s+i.amount,0);
const bal=total-TOTAL,pct=total>0?(TOTAL/total)*100:100;
const balA=useCount(Math.abs(bal)),totA=useCount(total);
const a1=useAnim(80),a2=useAnim(160),a3=useAnim(240);

const byDay={};FIXED.forEach(f=>{(byDay[f.due]=byDay[f.due]||[]).push(f);});
const days=Object.keys(byDay).map(Number).sort((a,b)=>a-b);

return(
<div style={{padding:isMobile?“20px 16px”:“40px 44px”,paddingBottom:isMobile?92:40}}>
<PageHeader sub=“Visão Geral” title={`${MO_F[month]} ${year}`}/>

```
  {/* Hero */}
  <div style={{...a1,position:"relative",borderRadius:20,overflow:"hidden",marginBottom:14,
    background:`linear-gradient(135deg,${P.bg3} 0%,${P.bg2} 100%)`,
    border:`1px solid ${P.line}`,
    boxShadow:"0 20px 60px rgba(0,0,0,0.35),0 1px 0 rgba(255,255,255,0.04) inset",
    padding:isMobile?"24px 22px":"32px 36px"}}>
    {/* Ambient */}
    <div style={{position:"absolute",top:-100,right:-100,width:350,height:350,borderRadius:"50%",background:`radial-gradient(circle,${P.accS},transparent 65%)`,pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:-80,left:-80,width:250,height:250,borderRadius:"50%",background:`radial-gradient(circle,${P.blueS},transparent 65%)`,pointerEvents:"none"}}/>
    <div style={{position:"relative"}}>
      <div style={{fontSize:10,color:P.textD,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>
        {bal>=0?"DISPONÍVEL ESTE MÊS":"DÉFICIT ESTE MÊS"}
      </div>
      <div style={{fontSize:isMobile?38:54,fontWeight:900,letterSpacing:-2.5,lineHeight:1,marginBottom:6,
        color:bal>=0?P.accL:P.neg,
        textShadow:bal>=0?`0 0 40px ${P.acc}50`:`0 0 40px ${P.neg}40`}}>
        {R(balA)}
      </div>
      <div style={{fontSize:12,color:P.textD,marginBottom:isMobile?20:28}}>
        {bal>=0?"Após todos os custos fixos":"Renda insuficiente para cobrir os fixos"}
      </div>
      {!isMobile?(
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:0,borderTop:`1px solid ${P.line}`,paddingTop:24}}>
          {[["Entradas",R(totA),P.accL],["Fixos Totais",R(TOTAL),P.neg],["Comprometido",`${pct.toFixed(0)}%`,pct>90?P.neg:pct>70?P.warn:P.accM]].map(([l,v,c],i)=>(
            <div key={l} style={{paddingLeft:i?24:0,borderLeft:i?`1px solid ${P.line}`:"none"}}>
              <div style={{fontSize:10,color:P.textD,fontWeight:600,letterSpacing:0.8,marginBottom:6}}>{l.toUpperCase()}</div>
              <div style={{fontSize:22,fontWeight:800,color:c,letterSpacing:-0.6}}>{v}</div>
            </div>
          ))}
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[["Entradas",R(totA),P.accL],["Fixos",R(TOTAL),P.neg]].map(([l,v,c])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.04)",borderRadius:11,padding:"12px 14px",border:`1px solid ${P.line}`}}>
              <div style={{fontSize:9,color:P.textD,fontWeight:700,letterSpacing:0.8,marginBottom:4}}>{l.toUpperCase()}</div>
              <div style={{fontSize:16,fontWeight:800,color:c}}>{v}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  </div>

  {/* Progress + Ring */}
  <div style={{...a2,display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr auto",gap:12,marginBottom:16}}>
    <Card style={{padding:"20px 24px"}} hover={false} delay={0}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span style={{fontSize:12,fontWeight:600,color:P.textS}}>Uso da Renda</span>
        <span style={{fontSize:15,fontWeight:800,color:pct>90?P.neg:pct>70?P.warn:P.accM}}>{pct.toFixed(0)}%</span>
      </div>
      <Bar value={TOTAL} max={total||1} color={pct>90?P.neg:pct>70?P.warn:P.acc} h={10}/>
